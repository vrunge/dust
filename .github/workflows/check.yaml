name: R CMD check

on: [push, pull_request]

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            backend: scalar
          - os: ubuntu-latest
            backend: Highway
          - os: macos-latest
            backend: scalar
          - os: macos-latest
            backend: Highway
          - os: windows-latest
            backend: scalar
    env:
      DUST_FORCE_SCALAR: ${{ matrix.backend == 'scalar' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Google Highway
        if: matrix.os == 'ubuntu-latest' && matrix.backend == 'Highway'
        run: sudo apt-get update && sudo apt-get install -y libhwy-dev
      - name: Install Google Highway on macOS
        if: matrix.os == 'macos-latest' && matrix.backend == 'Highway'
        run: brew install highway pkg-config
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--as-cran")'
